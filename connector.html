<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNB58 Connector</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 20px;
    text-align: center;
  }

  button {
    font-size: 24px;
    padding: 22px 36px;
    border-radius: 16px;
    border: 0;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
  }

  button:disabled { opacity: .55; cursor: default; }

  #status {
    max-width: 480px;
    padding: 16px;
    border-radius: 12px;
    background: #1e293b;
    color: #cbd5e1;
    font-size: 18px;
  }

  .ok   { color: #86efac; }
  .bad  { color: #fca5a5; }
  .warn { color: #fbbf24; }

  .reading {
    font-family: monospace;
    font-size: 22px;
    color: #fbbf24;
  }

  #scan-display {
    font-family: monospace;
    font-size: 16px;
    color: #94a3b8;
    min-height: 24px;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<h1>FNB58 Connector</h1>
<div id="status">Looking for previously authorized meter…</div>
<button id="btn" onclick="manualConnect()">Connect Meter</button>
<div class="reading" id="reading">No reading yet</div>
<div id="scan-display"></div>

<script>
const VID = 0x2E3C;
const PID = 0x5558;

let dev            = null;
let keepAliveTimer = null;
let keepAliveErrors = 0;
let pktCount       = 0;

// ─── Keyboard capture ─────────────────────────────────────────────────────────
// This window owns focus for the entire S2 session.
// Barcode scanner keystrokes are captured here and forwarded to S2 via postMessage.
// Individual keys go as FNB58_KEY (for screens like DEVICE_SELECT that need them).
// Enter-terminated sequences go as FNB58_SCAN (the full barcode value).

let scanBuf = '';

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'BUTTON') return;

  if (e.key === 'Enter') {
    const v = scanBuf.trim();
    scanBuf = '';
    updateScanDisplay('');
    if (v) postToS2({ type: 'FNB58_SCAN', value: v });
  } else if (e.key === 'Backspace') {
    scanBuf = scanBuf.slice(0, -1);
    updateScanDisplay(scanBuf);
  } else if (e.key.length === 1) {
    scanBuf += e.key;
    updateScanDisplay(scanBuf);
    postToS2({ type: 'FNB58_KEY', key: e.key });
  }
});

function updateScanDisplay(val) {
  document.getElementById('scan-display').textContent = val ? '▌' + val : '';
}

function postToS2(msg) {
  if (window.opener && !window.opener.closed) {
    window.opener.postMessage(msg, '*');
  }
}

// ─── HID helpers ─────────────────────────────────────────────────────────────

function makeCommand(type, checksum) {
  const data = new Uint8Array(64);
  data[0] = 0xaa; data[1] = type; data[63] = checksum;
  return data;
}

const CMD_81 = makeCommand(0x81, 0x8e);
const CMD_82 = makeCommand(0x82, 0x96);
const CMD_83 = makeCommand(0x83, 0x9e);

function st(msg, cls = '') {
  const el = document.getElementById('status');
  el.className = cls;
  el.textContent = msg;
}

function sendReading(sample) {
  document.getElementById('reading').textContent =
    sample.voltage.toFixed(3) + 'V / ' +
    sample.current.toFixed(3) + 'A / ' +
    sample.watts.toFixed(2)   + 'W / ' +
    sample.tempC.toFixed(1)   + '°C';

  postToS2({
    type    : 'FNB58_READING',
    voltage : sample.voltage,
    current : sample.current,
    watts   : sample.watts,
    tempC   : sample.tempC
  });
}

function decodePacket(e) {
  pktCount++;
  const d = e.data;
  if (!d || d.byteLength < 64) return;
  if (d.getUint8(0) !== 0xaa || d.getUint8(1) !== 0x04) return;

  let bestSample = null;

  for (let sampleNum = 0; sampleNum < 4; sampleNum++) {
    const off     = 2 + sampleNum * 15;
    if (off + 14 >= d.byteLength) continue;

    const voltage = d.getUint32(off,     true) / 100000;
    const current = d.getUint32(off + 4, true) / 100000;
    const tempC   = d.getUint16(off + 13,true) / 10;
    const watts   = voltage * current;

    if (
      Number.isFinite(voltage) && Number.isFinite(current) && Number.isFinite(tempC) &&
      voltage >= 0 && voltage <= 30 &&
      current >= 0 && current <= 10 &&
      tempC >= -20 && tempC <= 120
    ) {
      if (!bestSample || watts > bestSample.watts) {
        bestSample = { voltage, current, watts, tempC };
      }
    }
  }

  if (bestSample) sendReading(bestSample);
}

// ─── Keepalive ────────────────────────────────────────────────────────────────
// Runs every 500ms. Allows up to 5 consecutive failures before giving up
// and attempting auto-reconnect — prevents a single missed ping from killing
// the session.

function startKeepalive() {
  clearInterval(keepAliveTimer);
  keepAliveErrors = 0;

  keepAliveTimer = setInterval(async () => {
    try {
      await dev.sendReport(0, CMD_83);
      keepAliveErrors = 0;
    } catch (e) {
      keepAliveErrors++;
      if (keepAliveErrors >= 5) {
        clearInterval(keepAliveTimer);
        dev = null;
        st('Meter disconnected. Attempting to reconnect…', 'warn');
        setTimeout(autoConnect, 2000);
      }
    }
  }, 500);
}

// ─── Open device ─────────────────────────────────────────────────────────────

async function openDevice(device) {
  try {
    dev = device;
    dev.addEventListener('inputreport', decodePacket);

    if (!dev.opened) await dev.open();

    st('Connected. Sending init…', 'warn');
    await new Promise(r => setTimeout(r, 800));
    await dev.sendReport(0, CMD_81);
    await new Promise(r => setTimeout(r, 100));
    await dev.sendReport(0, CMD_82);
    await new Promise(r => setTimeout(r, 100));
    await dev.sendReport(0, CMD_82);

    startKeepalive();

    st('Connected. Return to Station 2. Keep this window open.', 'ok');
    document.getElementById('btn').textContent = 'Connected';
    document.getElementById('btn').disabled    = true;
  } catch (e) {
    dev = null;
    st(e.name + ': ' + e.message, 'bad');
    document.getElementById('btn').disabled = false;
  }
}

// ─── Auto-connect ─────────────────────────────────────────────────────────────
// Runs on load and after keepalive failures.
// Uses getDevices() which returns already-authorized devices with no user gesture.
// On the first-ever use, falls through silently to the manual Connect button.

async function autoConnect() {
  if (!navigator.hid) {
    st('WebHID not available in this browser.', 'bad');
    return;
  }

  try {
    const devices = await navigator.hid.getDevices();
    const fnb58   = devices.find(d => d.vendorId === VID && d.productId === PID);

    if (fnb58) {
      st('Found authorized meter — connecting…', 'warn');
      await openDevice(fnb58);
    } else {
      st('No authorized meter found. Click Connect Meter to authorize it for the first time.', '');
    }
  } catch (e) {
    st('Auto-connect failed: ' + e.message, 'bad');
  }
}

// ─── Hot-plug reconnect ───────────────────────────────────────────────────────
// If the FNB58 is physically unplugged and plugged back in mid-session,
// this picks it up automatically without any staff action.

navigator.hid && navigator.hid.addEventListener('connect', async ({ device }) => {
  if (device.vendorId === VID && device.productId === PID && !dev) {
    st('Meter plugged in — reconnecting…', 'warn');
    await openDevice(device);
  }
});

// ─── Manual connect ───────────────────────────────────────────────────────────
// Only needed on the very first use to grant browser permission.
// After that, autoConnect() handles everything.

async function manualConnect() {
  if (!navigator.hid) {
    st('WebHID not available here.', 'bad');
    return;
  }

  try {
    st('Select FNB-58 from the browser popup…', 'warn');
    document.getElementById('btn').disabled = true;

    const devices = await navigator.hid.requestDevice({
      filters: [{ vendorId: VID, productId: PID }]
    });

    if (!devices.length) {
      st('No meter selected.', 'bad');
      document.getElementById('btn').disabled = false;
      return;
    }

    await openDevice(devices[0]);
  } catch (e) {
    st(e.name + ': ' + e.message, 'bad');
    document.getElementById('btn').disabled = false;
  }
}

// ─── Init ─────────────────────────────────────────────────────────────────────

autoConnect();
</script>

</body>
</html>
